# fly.toml app configuration file generated for dixt on 2026-10-31T01:53:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dixt'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
